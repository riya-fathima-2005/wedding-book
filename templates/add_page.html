{% extends 'base.html' %}

{% block content %}

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- ===========================
            ADD PAGE CARD
    =========================== -->

    <div class="page-card">

        <div class="page-card-header">
            <h3>Add Page</h3>

            <a href="{% url 'pages' %}" class="page-list-btn">
                <i class="bi bi-list"></i> List All
            </a>
        </div>

        <div class="page-card-body">

            <!-- ===========================
                    BASIC DETAILS
            =========================== -->

            <div class="page-grid">

                <div class="form-group">
                    <label>Choose Position</label>

                    <select name="position">
                        <option value="">----------</option>
                        <option value="main">Main Navigation</option>
                        <option value="footer">Footer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Choose Parent</label>

                    <select name="parent">
                        <option value="">----------</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Page Name</label>

                    <input
                        type="text"
                        name="page_name"
                        placeholder="About Us"
                    >
                </div>

                <div class="form-group">
                    <label>Title</label>

                    <input
                        type="text"
                        name="title"
                    >
                </div>

                <div class="form-group">
                    <label>URL Slug</label>

                    <input
                        type="text"
                        name="slug"
                        placeholder="about-us"
                    >
                </div>

                <div class="form-group">
                    <label>
                        Nav Priority
                        <small>(Lower = appears first)</small>
                    </label>

                    <input
                        type="number"
                        name="nav_priority"
                        value="0"
                    >
                </div>

            </div>

            <!-- NAVBAR -->

            <div class="switch-row">

                <label class="switch">

                    <input
                        type="checkbox"
                        name="show_in_navbar"
                        checked
                    >

                    <span class="slider"></span>

                </label>

                <span>Show in Main Navigation Menu</span>

            </div>

            <!-- CONTENT -->

            <div class="form-group mt-4">

                <label>Description</label>

                {{ form.media }}

                {{ form.content }}

            </div>

        </div>

    </div>

    <!-- ===========================
            SEO SETTINGS
    =========================== -->

    <div class="page-card mt-4">

        <div class="page-card-header">
            <h3>SEO Settings</h3>
        </div>

        <div class="page-card-body">

            <div class="page-grid">

                <div class="form-group">
                    <label>Meta Title</label>
                    <input type="text" name="meta_title">
                </div>

                <div class="form-group">
                    <label>Meta Description</label>
                    <textarea rows="4" name="meta_description"></textarea>
                </div>

                <div class="form-group">
                    <label>Open Graph Image</label>
                    <input type="file" name="og_image">
                </div>

                <div class="form-group">
                    <label>Meta Keywords</label>
                    <input
                        type="text"
                        name="meta_keywords"
                        placeholder="wedding, kerala wedding..."
                    >
                </div>

                <div class="form-group">
                    <label>Canonical URL</label>
                    <input type="url" name="canonical_url">
                </div>

                <div class="form-group">
                    <label>Robots</label>

                    <select name="robots">
                        <option value="index">Index</option>
                        <option value="noindex">No Index</option>
                    </select>
                </div>

            </div>

        </div>

    </div>

    <!-- ===========================
            PAGE SETTINGS
    =========================== -->

    <div class="page-card mt-4">

        <div class="page-card-header">
            <h3>Page Settings</h3>
        </div>

        <div class="page-card-body">

            <div class="page-grid">

                <div class="form-group">
                    <label>Status</label>

                    <select name="status">
                        <option value="published">Published</option>
                        <option value="draft">Draft</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Visibility</label>

                    <select name="visibility">
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                    </select>
                </div>

                <div class="switch-row">

                    <label class="switch">

                        <input
                            type="checkbox"
                            name="show_in_footer"
                        >

                        <span class="slider"></span>

                    </label>

                    <span>Show in Footer</span>

                </div>

                <div class="form-group">
                    <label>Created At</label>

                    <input
                        type="text"
                        value="Will be set automatically"
                        readonly
                    >
                </div>

                <div class="form-group">
                    <label>Updated At</label>

                    <input
                        type="text"
                        value="Will be set automatically"
                        readonly
                    >
                </div>

            </div>

        </div>

    </div>

    <!-- ===========================
            ACTION BUTTONS
    =========================== -->

    <div class="page-action-btns">

        <button
            type="reset"
            class="btn-cancel"
        >
            Cancel
        </button>

        <button
            type="button"
            class="btn-preview"
        >
            <i class="bi bi-eye"></i>
            Preview
        </button>

        <button
            type="submit"
            class="btn-publish"
        >
            <i class="bi bi-send"></i>
            Publish Page
        </button>

    </div>

</form>

{% endblock %}
