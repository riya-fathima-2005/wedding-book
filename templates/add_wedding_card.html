{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow-lg border-0 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Add Wedding Card</h2>

            <a href="{% url 'wedding_cards' %}"
               class="btn btn-outline-dark">
                Back
            </a>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Bride Name
                    </label>
                    <input type="text"
                           name="bride_name"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Groom Name
                    </label>
                    <input type="text"
                           name="groom_name"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Location
                    </label>
                    <input type="text"
                           name="location"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Wedding Date
                    </label>
                    <input type="date"
                           name="wedding_date"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        rows="5"
                        class="form-control"
                        placeholder="Enter wedding details..."
                    ></textarea>
                </div>

                <div class="col-md-12 mb-4">
                    <label class="form-label">
                        Wedding Image
                    </label>

                    <input
                        type="file"
                        name="image"
                        class="form-control"
                        required
                    >
                </div>

            </div>

            <button
                type="submit"
                class="btn btn-dark px-5"
            >
                Save Wedding Card
            </button>

        </form>
    </div>
</div>

{% endblock %}
