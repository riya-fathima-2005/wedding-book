{% extends 'base.html' %}

{% block content %}

<div class="blog-admin-wrapper">

    <form method="POST">
        {% csrf_token %}

        <div class="blog-admin-card">

            <h2>Add Blog Category</h2>

            <div class="blog-input-group">
                <label>Category Name</label>
                <input type="text" name="name" required>
            </div>

            <button type="submit" class="blog-publish-btn">
                Save Category
            </button>

        </div>

    </form>

</div>

{% endblock %}
