{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SIGN IN</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f8f5f0;
        font-family: Arial, sans-serif;
      }

      .auth-section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
      }

      .auth-card {
        width: 100%;
        max-width: 1100px;
        background: #fff;
        border-radius: 30px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .auth-left {
        background: url("https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1200");
        background-size: cover;
        background-position: center;
        min-height: 700px;
        position: relative;
      }

      .auth-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
      }

      .auth-content {
        position: absolute;
        bottom: 60px;
        left: 50px;
        color: white;
        z-index: 2;
      }

      .auth-content h1 {
        font-size: 55px;
        font-weight: 800;
        margin-bottom: 20px;
      }

      .auth-content p {
        font-size: 18px;
        max-width: 400px;
        line-height: 1.7;
      }

      .auth-right {
        padding: 70px;
        display: flex;
        align-items: center;
      }

      .form-box {
        width: 100%;
      }

      .form-title {
        font-size: 45px;
        font-weight: 800;
        margin-bottom: 10px;
      }

      .form-subtitle {
        color: #777;
        margin-bottom: 40px;
      }

      .form-control {
        height: 60px;
        border-radius: 14px;
        margin-bottom: 25px;
        border: 1px solid #ddd;
        padding-left: 20px;
      }

      .login-btn {
        width: 100%;
        height: 60px;
        border: none;
        border-radius: 14px;
        background: black;
        color: white;
        font-size: 18px;
        font-weight: 600;
      }

      .bottom-link {
        text-align: center;
        margin-top: 25px;
      }

      .bottom-link a {
        color: black;
        font-weight: 600;
        text-decoration: none;
      }

      @media (max-width: 992px) {
        .auth-card {
          grid-template-columns: 1fr;
        }

        .auth-left {
          min-height: 350px;
        }

        .auth-right {
          padding: 40px;
        }
      }
    </style>
  </head>

  <body>
    <section class="auth-section">
      <div class="auth-card">
        <!-- LEFT -->

        <div class="auth-left">
          <div class="auth-overlay"></div>

          <div class="auth-content">
            <h1>Welcome Back</h1>

            <p>
              Sign in to manage your wedding bookings, venues, and unforgettable
              celebrations.
            </p>
          </div>
        </div>

        <!-- RIGHT -->

        <div class="auth-right">
          <div class="form-box">
            <h2 class="form-title">Sign in</h2>

            <p class="form-subtitle">Access your wedding dashboard</p>

            <form method="POST">
              {% csrf_token %}
              <!-- USERNAME -->

              <input
                type="text"
                name="username"
                placeholder="Username"
                class="form-control"
                required
              />

              <!-- EMAIL -->

              <input
                type="email"
                name="email"
                placeholder="Email Address"
                class="form-control"
                required
              />

              <!-- NAME ROW -->

              <div class="row">
                <!-- FIRST NAME -->

                <div class="col-md-6">
                  <input
                    type="text"
                    name="first_name"
                    placeholder="First Name"
                    class="form-control"
                    required
                  />
                </div>

                <!-- SECOND NAME -->

                <div class="col-md-6">
                  <input
                    type="text"
                    name="last_name"
                    placeholder="Second Name"
                    class="form-control"
                    required
                  />
                </div>
              </div>

              <!-- PASSWORD -->

              <input
                type="password"
                name="password"
                placeholder="Password"
                class="form-control"
                required
              />

              <!-- CONFIRM PASSWORD -->

              <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                class="form-control"
                required
              />

              <button type="submit" class="login-btn">sign in</button>
            </form>

            <div class="bottom-link">
              Don’t have an account?

              <a href="{% url 'login' %}"> login </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
