{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow p-4">

        <h2 class="mb-4">
            Edit Wedding
        </h2>

        <form
            method="POST"
            enctype="multipart/form-data"
        >
            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Bride First Name</label>

                    <input
                        type="text"
                        name="firstname"
                        class="form-control"
                        value="{{ wedding.firstname }}"
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label>Bride Last Name</label>

                    <input
                        type="text"
                        name="lastname"
                        class="form-control"
                        value="{{ wedding.lastname }}"
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label>Groom First Name</label>

                    <input
                        type="text"
                        name="partner_firstname"
                        class="form-control"
                        value="{{ wedding.partner_firstname }}"
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label>Groom Last Name</label>

                    <input
                        type="text"
                        name="partner_lastname"
                        class="form-control"
                        value="{{ wedding.partner_lastname }}"
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ wedding.email }}"
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label>Phone</label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ wedding.phone }}"
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label>Wedding Date</label>

                    <input
                        type="date"
                        name="wedding_date"
                        class="form-control"
                        value="{{ wedding.wedding_date|date:'Y-m-d' }}"
                    >
                </div>

                <div class="col-md-6 mb-3">
                    <label>Wedding Time</label>

                    <input
                        type="time"
                        name="wedding_time"
                        class="form-control"
                        value="{{ wedding.wedding_time|time:'H:i' }}"
                    >
                </div>

                <div class="col-md-12 mb-3">
                    <label>Description</label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="5"
                    >{{ wedding.description }}</textarea>
                </div>

                <div class="col-md-12 mb-3">
                    <label>Profile Image</label>

                    <input
                        type="file"
                        name="profile_image"
                        class="form-control"
                    >

                    {% if wedding.profile_image %}
                    <img
                        src="{{ wedding.profile_image.url }}"
                        width="150"
                        class="mt-3"
                    >
                    {% endif %}
                </div>

            </div>

            <button
                type="submit"
                class="btn btn-dark"
            >
                Update Wedding
            </button>

        </form>

    </div>
</div>

{% endblock %}
